[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-saas-backend"
version = "0.1.0"
description = "Multi-merchant, multi-shop SaaS ecommerce backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "email-validator>=2.2,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "PyMySQL>=1.1,<2.0",
    "cryptography>=44,<50",
    "alembic>=1.14,<2.0",
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "httpx>=0.27,<1.0", "pytest-cov>=6.0,<8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
